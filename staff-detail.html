<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Staff Profile · FIDUCIA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050608;
      color: #f5f5f5;
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }

    .wrapper {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px 64px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      margin-bottom: 24px;
    }
    .logo {
      font-size: 14px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 700;
    }
    nav {
      font-size: 12px;
      display: flex;
      gap: 10px;
      opacity: 0.8;
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 10px;
      margin-bottom: 16px;
    }
    .avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,0.4);
      background: rgba(0,0,0,0.5);
      flex-shrink: 0;
    }
    .avatar-fallback {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      background: rgba(0,0,0,0.6);
      flex-shrink: 0;
    }

    h1 {
      font-size: 26px;
      margin: 0 0 6px;
    }
    .subtitle {
      font-size: 13px;
      color: rgba(255,255,255,0.75);
      margin-bottom: 4px;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.25);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      opacity: 0.9;
      margin-bottom: 8px;
    }

    .section {
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .section-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      opacity: 0.8;
      margin-bottom: 6px;
    }
    .section-body {
      font-size: 14px;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .pill {
      font-size: 11px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 3px 9px;
    }

    .link-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }
    .link-pill {
      font-size: 12px;
      border-radius: 999px;
      border: 1px solid rgba(123,165,255,0.8);
      padding: 3px 10px;
      color: #7BA5FF;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      color: rgba(173,205,255,0.9);
      margin-top: 26px;
    }

    .status {
      font-size: 13px;
      opacity: 0.8;
      margin-top: 20px;
    }
  </style>
</head>
<body>
<div class="wrapper">
  <header>
    <div class="logo">FIDUCIA · STAFF PROFILE</div>
    <nav>
      <a href="index.html">AI 스틸컷</a> ·
      <a href="directors.html">DIRECTORS</a> ·
      <a href="staff.html">STAFF</a>
    </nav>
  </header>

  <main id="content">
    <div id="loading" class="status">스태프 정보를 불러오는 중입니다...</div>
  </main>

  <a href="javascript:history.back()" class="back-link">← 뒤로가기</a>
</div>

<script>
  function getQueryId() {
    const params = new URLSearchParams(window.location.search);
    return params.get("id");
  }

  function renderStaff(s) {
    const contentEl = document.getElementById("content");
    const loadingEl = document.getElementById("loading");
    if (loadingEl) loadingEl.remove();

    if (!s) {
      contentEl.innerHTML = `
        <p class="status">
          스태프 정보를 찾을 수 없습니다. 링크가 잘못되었거나, 노션에서 비공개 처리되었을 수 있습니다.
        </p>
      `;
      return;
    }

    const rolesText = (s.roles || []).join(" · ");
    const tags = s.tags || [];

    const links = [];
    if (s.portfolio_url) {
      links.push(
        `<a class="link-pill" href="${s.portfolio_url}" target="_blank" rel="noreferrer">포트폴리오</a>`
      );
    }
    if (s.schedule_url) {
      links.push(
        `<a class="link-pill" href="${s.schedule_url}" target="_blank" rel="noreferrer">스케줄</a>`
      );
    }
    if (s.instagram) {
      links.push(
        `<a class="link-pill" href="${s.instagram}" target="_blank" rel="noreferrer">Instagram</a>`
      );
    }

    const avatarHtml = s.profile_image_url
      ? `<img class="avatar" src="${s.profile_image_url}" alt="${s.name || ""}" />`
      : `<div class="avatar-fallback">${(s.name || "?").charAt(0)}</div>`;

    contentEl.innerHTML = `
      <div class="badge">STAFF</div>

      <div class="profile-header">
        ${avatarHtml}
        <div>
          <h1>${s.name || "이름 미입력"}</h1>
          <div class="subtitle">
            ${s.level ? s.level + " · " : ""}${rolesText || ""}
          </div>
          ${
            links.length
              ? `<div class="link-row">${links.join("")}</div>`
              : ""
          }
        </div>
      </div>

      <section class="section">
        <div class="section-title">INTRO / BIO</div>
        <div class="section-body">
          ${s.bio || "소개가 아직 작성되지 않았습니다."}
        </div>
      </section>

      <section class="section">
        <div class="section-title">MAIN GEAR</div>
        <div class="section-body">
          ${s.main_gear || "주 장비 정보가 아직 입력되지 않았습니다."}
        </div>
      </section>

      <section class="section">
        <div class="section-title">AVAILABLE DAYS</div>
        <div class="section-body">
          ${s.available_days || "일정은 협의 가능합니다."}
        </div>
      </section>

      <section class="section">
        <div class="section-title">TAGS</div>
        <div class="section-body">
          ${
            tags.length
              ? `<div class="pill-row">
                  ${tags.map(t => `<span class="pill">${t}</span>`).join("")}
                 </div>`
              : "태그가 아직 없습니다."
          }
        </div>
      </section>
    `;
  }

  async function loadStaffDetail() {
    const id = getQueryId();
    const loadingEl = document.getElementById("loading");

    if (!id) {
      if (loadingEl) {
        loadingEl.textContent = "잘못된 접근입니다. id 파라미터가 없습니다.";
      }
      return;
    }

    try {
      const res = await fetch("/.netlify/functions/staff");
      if (!res.ok) {
        if (loadingEl) {
          loadingEl.textContent = "스태프 정보를 불러오는 중 오류가 발생했습니다.";
        }
        return;
      }
      const json = await res.json();
      const items = json.items || [];
      const staff = items.find((p) => p.id === id);
      renderStaff(staff);
    } catch (err) {
      if (loadingEl) {
        loadingEl.textContent = "스태프 정보를 불러오는 중 오류가 발생했습니다.";
      }
    }
  }

  loadStaffDetail();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>FIDUCIA DIRECTORS · 감독 라인업</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- CSS 파일 연결 -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 헤더 -->
  <header>
    <div class="logo">FIDUCIA COLLECTIVE</div>
    <nav>
      <a href="#directors">Directors</a> ·
      <strong>DIRECTORS</strong> ·
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <!-- 메인 콘텐츠 -->
  <main>
    <!-- Hero 섹션 -->
    <section id="hero">
      <!-- Canva 디자인 이미지 삽입 -->
      <img src="assets/images/director-market.jpg" alt="Director's Market" class="hero-image">
      <h1>FIDUCIA DIRECTORS</h1>
      <p>신뢰를 디자인하는 프로젝트 플랫폼</p>
    </section>

    <!-- 디렉터 작업물 예시 -->
    <section id="recent-work">
      <h2>Recent Work</h2>
      <div class="work-card">
        <img src="assets/images/recent-work1.jpg" alt="Close up">
        <p>Close Up</p>
      </div>
      <div class="work-card">
        <img src="assets/images/recent-work2.jpg" alt="D.O.P">
        <p>D.O.P</p>
      </div>
    </section>

    <!-- 연락처 섹션 -->
    <section id="contact">
      <h2>Contact Us</h2>
      <p>문의는 아래 연락처로 해주세요.</p>
    </section>
  </main>

  <!-- 푸터 -->
  <footer>
    <p>&copy; 2025 Fiducia Collective. All rights reserved.</p>
  </footer>

</body>
</html>

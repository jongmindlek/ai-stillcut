<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>FIDUCIA STAFF · 크루 라인업</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #07080b;
      color: #f5f5f5;
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }

    .wrapper {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 64px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      margin-bottom: 24px;
    }
    .logo {
      font-size: 14px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 700;
    }
    .tagline {
      font-size: 12px;
      opacity: 0.8;
    }

    nav {
      font-size: 12px;
      display: flex;
      gap: 10px;
      opacity: 0.8;
    }
    nav a {
      color: rgba(255,255,255,0.8);
    }
    nav strong {
      font-weight: 700;
    }

    h1 {
      font-size: 26px;
      margin: 20px 0 8px;
    }
    .lead {
      font-size: 14px;
      color: rgba(255,255,255,0.8);
      margin-bottom: 12px;
    }

    .search-row {
      margin-bottom: 10px;
    }
    .search-input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(7,8,11,0.95);
      color: #f5f5f5;
      font-size: 13px;
      outline: none;
    }
    .search-input::placeholder {
      color: rgba(255,255,255,0.45);
    }
    .search-input:focus {
      border-color: #3A6CF3;
      box-shadow: 0 0 0 1px rgba(58,108,243,0.4);
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 13px;
    }
    .filter-chip {
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.22);
      padding: 4px 10px;
      background: transparent;
      color: #f5f5f5;
      cursor: pointer;
      opacity: 0.82;
    }
    .filter-chip.active {
      background: linear-gradient(135deg, #3A6CF3, #7BA5FF);
      color: #05060a;
      border-color: transparent;
      opacity: 1;
    }

    .level-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
      font-size: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .card {
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.18), transparent 55%),
        radial-gradient(circle at bottom right, rgba(255,255,255,0.06), transparent 55%);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.16);
      padding: 16px 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }
    .profile-block {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(0,0,0,0.4);
      flex-shrink: 0;
    }
    .avatar-fallback {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 600;
      background: rgba(0,0,0,0.5);
      flex-shrink: 0;
    }
    .name-level {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .name {
      font-size: 16px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .level-pill {
      font-size: 11px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.25);
      padding: 2px 8px;
      opacity: 0.85;
      display: inline-block;
      max-width: 140px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .fav-btn {
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 0 0 0 8px;
      color: rgba(255,255,255,0.5);
      flex-shrink: 0;
    }
    .fav-btn.active {
      color: #ffd86b;
      text-shadow: 0 0 6px rgba(255,216,107,0.6);
    }

    .roles {
      font-size: 12px;
      opacity: 0.85;
    }
    .meta {
      font-size: 12px;
      opacity: 0.8;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }
    .tag {
      font-size: 11px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.25);
      padding: 2px 8px;
      opacity: 0.9;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
      font-size: 12px;
    }
    .link-pill {
      border-radius: 999px;
      border: 1px solid rgba(123,165,255,0.8);
      padding: 2px 10px;
      color: #7BA5FF;
    }

    .detail-link {
      margin-top: 4px;
      font-size: 12px;
      opacity: 0.85;
      color: rgba(255,255,255,0.85);
      text-decoration: underline;
      text-decoration-style: dotted;
    }

    .status {
      font-size: 12px;
      opacity: 0.8;
      margin-bottom: 10px;
    }
    .back-link {
      display: inline-block;
      margin-top: 28px;
      font-size: 13px;
      opacity: 0.85;
      color: #7BA5FF;
    }
  </style>
</head>

<body>
<div class="wrapper">
  <header>
    <div>
      <div class="logo">FIDUCIA · STAFF</div>
      <nav>
        <a href="/">AI 스틸컷</a> ·
        <a href="/directors.html">DIRECTORS</a> ·
        <strong>STAFF</strong>
      </nav>
    </div>
    <div class="tagline">퍼스트 · 세컨 · 서드 · 막내 / 크루 라인업</div>
  </header>

  <main>
    <h1>FIDUCIA STAFF / CREW</h1>
    <p class="lead">
      함께 성장할 크루/스태프들의 라인업입니다.<br>
      퍼스트 · 세컨 · 서드 · 막내 등 원하는 포지션의 인원을 찾아보세요.
    </p>

    <div class="search-row">
      <input id="search-input" class="search-input" placeholder="이름, 포지션, 장비, 태그로 검색해보세요." />
    </div>

    <div class="filter-row">
      <button class="filter-chip active" data-filter="all">전체</button>
      <button class="filter-chip" data-filter="fav">즐겨찾기만</button>
    </div>

    <div class="level-row">
      <span style="opacity:0.8;">레벨:</span>
      <button class="filter-chip active" data-level="all">전체</button>
      <button class="filter-chip" data-level="1st">퍼스트</button>
      <button class="filter-chip" data-level="2nd">세컨</button>
      <button class="filter-chip" data-level="3rd">서드</button>
      <button class="filter-chip" data-level="막내">막내</button>
    </div>

    <div id="status" class="status">불러오는 중...</div>
    <div id="staff-grid" class="grid"></div>

    <a href="/" class="back-link">← AI 스틸컷 서비스로 돌아가기</a>
  </main>
</div>

<script>
  const gridEl = document.getElementById("staff-grid");
  const statusEl = document.getElementById("status");
  const searchInput = document.getElementById("search-input");

  const FILTER_ALL = "all";
  const FILTER_FAV = "fav";
  let currentFilter = FILTER_ALL;
  let currentLevel = "all";

  let allStaff = [];
  let favoriteIds = [];
  let searchTerm = "";

  const FAV_KEY = "fiducia_fav_staff_v1";

  function loadFavorites() {
    try {
      const raw = localStorage.getItem(FAV_KEY);
      favoriteIds = raw ? JSON.parse(raw) : [];
    } catch {
      favoriteIds = [];
    }
  }

  function saveFavorites() {
    localStorage.setItem(FAV_KEY, JSON.stringify(favoriteIds));
  }

  function isFavorite(id) {
    return favoriteIds.includes(id);
  }

  function toggleFavorite(id) {
    if (isFavorite(id)) {
      favoriteIds = favoriteIds.filter(x => x !== id);
    } else {
      favoriteIds.push(id);
    }
    saveFavorites();
    renderStaff();
  }

  function setFilter(f) {
    currentFilter = f;
    document.querySelectorAll(".filter-chip[data-filter]").forEach(chip => {
      chip.classList.toggle("active", chip.dataset.filter === f);
    });
    renderStaff();
  }

  function setLevel(level) {
    currentLevel = level;
    document.querySelectorAll(".filter-chip[data-level]").forEach(chip => {
      chip.classList.toggle("active", chip.dataset.level === level);
    });
    renderStaff();
  }

  function setSearch(term) {
    searchTerm = (term || "").toLowerCase();
    renderStaff();
  }

  function renderStaff() {
    gridEl.innerHTML = "";

    let list = allStaff.slice();

    if (currentFilter === FILTER_FAV) {
      list = list.filter(p => isFavorite(p.id));
    }

    if (currentLevel !== "all") {
      list = list.filter(p => (p.level || "").trim() === currentLevel);
    }

    if (searchTerm) {
      list = list.filter(p => {
        const text = [
          p.name || "",
          (p.roles || []).join(" "),
          p.main_gear || "",
          (p.tags || []).join(" "),
          p.bio || ""
        ]
          .join(" ")
          .toLowerCase();
        return text.includes(searchTerm);
      });
    }

    if (!list.length) {
      gridEl.innerHTML =
        `<p style="font-size:13px; opacity:0.8;">조건에 맞는 스태프가 없습니다.</p>`;
      return;
    }

    for (const p of list) {
      const tagsHtml = (p.tags || [])
        .map(t => `<span class="tag">${t}</span>`)
        .join("");

      const favActive = isFavorite(p.id);
      const favSymbol = favActive ? "★" : "☆";

      const avatarHtml = p.profile_image_url
        ? `<img class="avatar" src="${p.profile_image_url}" alt="${p.name || ""}" />`
        : `<div class="avatar-fallback">${(p.name || "?").charAt(0)}</div>`;

      const links = [];
      if (p.portfolio_url) {
        links.push(`<a class="link-pill" href="${p.portfolio_url}" target="_blank" rel="noreferrer">포트폴리오</a>`);
      }
      if (p.schedule_url) {
        links.push(`<a class="link-pill" href="${p.schedule_url}" target="_blank" rel="noreferrer">스케줄</a>`);
      }
      if (p.instagram) {
        links.push(`<a class="link-pill" href="${p.instagram}" target="_blank" rel="noreferrer">Instagram</a>`);
      }

      const detailUrl = "/staff-detail.html?id=" + encodeURIComponent(p.id);

      const html = `
        <article class="card">
          <div class="top-row">
            <div class="profile-block">
              ${avatarHtml}
              <div class="name-level">
                <div class="name">${p.name}</div>
                ${p.level ? `<span class="level-pill">${p.level}</span>` : ""}
              </div>
            </div>
            <button class="fav-btn ${favActive ? "active" : ""}" data-id="${p.id}">${favSymbol}</button>
          </div>

          ${p.roles?.length ? `<div class="roles">포지션 · ${p.roles.join(" · ")}</div>` : ""}
          ${p.main_gear ? `<div class="meta">주 장비 · ${p.main_gear}</div>` : ""}
          ${p.available_days ? `<div class="meta">가능 요일 · ${p.available_days}</div>` : ""}
          ${p.bio ? `<div class="meta">${p.bio}</div>` : ""}
          <div class="tags">${tagsHtml}</div>
          <div class="links">${links.join("")}</div>
          <a class="detail-link" href="${detailUrl}">스태프 상세 보기 →</a>
        </article>
      `;
      gridEl.insertAdjacentHTML("beforeend", html);
    }

    document.querySelectorAll(".fav-btn").forEach(btn => {
      btn.onclick = e => {
        e.stopPropagation();
        toggleFavorite(btn.dataset.id);
      };
    });
  }

  async function loadStaff() {
    try {
      const res = await fetch("/.netlify/functions/staff");
      const json = await res.json();
      allStaff = json.items || [];
      statusEl.textContent = "";
      renderStaff();
    } catch (e) {
      statusEl.textContent = "스태프 정보를 불러오는데 실패했습니다.";
    }
  }

  loadFavorites();
  loadStaff();

  document.querySelectorAll(".filter-chip[data-filter]").forEach(chip => {
    chip.onclick = () => setFilter(chip.dataset.filter);
  });

  document.querySelectorAll(".filter-chip[data-level]").forEach(chip => {
    chip.onclick = () => setLevel(chip.dataset.level);
  });

  searchInput.oninput = e => setSearch(e.target.value);
</script>

</body>
</html>

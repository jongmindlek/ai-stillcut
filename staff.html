<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>FIDUCIA STAFF · 크루 라인업</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #07080b;
      color: #f5f5f5;
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }

    .wrapper {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 64px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      margin-bottom: 24px;
    }
    .logo {
      font-size: 14px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 700;
    }
    .tagline {
      font-size: 12px;
      opacity: 0.8;
    }

    h1 {
      font-size: 26px;
      margin: 20px 0 8px;
    }
    .lead {
      font-size: 14px;
      color: rgba(255,255,255,0.8);
      margin-bottom: 20px;
    }

    .role-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }
    .role-tab {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.2);
      font-size: 12px;
      cursor: pointer;
      background: transparent;
      color: #f5f5f5;
      opacity: 0.75;
    }
    .role-tab.active {
      background: linear-gradient(135deg, #3A6CF3, #7BA5FF);
      color: #07080b;
      opacity: 1;
      border-color: transparent;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }
    .card {
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.18), transparent 55%),
        radial-gradient(circle at bottom right, rgba(255,255,255,0.06), transparent 55%);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.16);
      padding: 16px 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .name-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .name {
      font-size: 16px;
      font-weight: 600;
    }
    .level-pill {
      font-size: 11px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.25);
      padding: 2px 8px;
      opacity: 0.85;
    }
    .roles {
      font-size: 12px;
      opacity: 0.85;
    }
    .gear {
      font-size: 12px;
      opacity: 0.85;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }
    .tag {
      font-size: 11px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.25);
      padding: 2px 8px;
      opacity: 0.9;
    }
    .back-link {
      display: inline-block;
      margin-top: 28px;
      font-size: 13px;
      opacity: 0.85;
      color: #7BA5FF;
    }
  </style>
</head>

<body>
<div class="wrapper">
  <header>
    <div class="logo">FIDUCIA · STAFF</div>
    <div class="tagline">퍼스트 · 세컨 · 서드 · 막내 크루 라인업</div>
  </header>

  <main>
    <h1>FIDUCIA STAFF / CREW</h1>
    <p class="lead">
      함께 성장할 크루/스태프들의 라인업입니다.<br>
      퍼스트 · 세컨 · 서드 · 막내 등 원하는 포지션의 인원을 찾아보세요.
    </p>

    <!-- 퍼스트/세컨/서드/막내 탭 -->
    <div class="role-tabs">
      <button class="role-tab active" data-role="all">전체</button>
      <button class="role-tab" data-role="퍼스트">퍼스트</button>
      <button class="role-tab" data-role="세컨">세컨</button>
      <button class="role-tab" data-role="서드">서드</button>
      <button class="role-tab" data-role="막내">막내</button>
    </div>

    <div id="staff-grid" class="grid"></div>

    <a href="/" class="back-link">← AI 스틸컷 서비스로 돌아가기</a>
  </main>
</div>

<script>
  // STAFF 예시 데이터 (나중에 노션/DB로 대체 예정)
  const people = [
    {
      const people = [
  {
    name: "김막내",
    type: "staff",
    roles: ["막내"],
    bio: "성실하게 배우고 싶습니다. 장비 운반 및 기본 촬영 보조 가능합니다.",
    style_tags: ["성실", "운전 가능", "피지컬 좋음"],
    level: "막내"
  },
  {
    name: "이서드",
    type: "staff",
    roles: ["서드"],
    bio: "현장 센스 좋고 러닝 빠릅니다. 카메라/조명 서포트 모두 가능합니다.",
    style_tags: ["빠른 러닝", "현장 센스", "멀티 포지션"],
    level: "서드"
  },
  {
    name: "박세컨",
    type: "staff",
    roles: ["세컨"],
    bio: "포커스 풀링 및 모니터링 중심으로 서포트합니다.",
    style_tags: ["집중력", "포커스 감각", "장비 이해도"],
    level: "세컨"
  },
  {
    name: "최퍼스트",
    type: "staff",
    roles: ["퍼스트"],
    bio: "촬영팀 리딩 및 장비 세팅 총괄 경험이 있습니다.",
    style_tags: ["리더십", "세팅 총괄", "경험 풍부"],
    level: "퍼스트"
  }
];
  const gridEl = document.getElementById("staff-grid");
  const tabEls = document.querySelectorAll(".role-tab");

  function renderStaff(filterRole = "all") {
    gridEl.innerHTML = "";

    const filtered = people.filter(p => {
      if (p.type !== "staff") return false;
      if (filterRole === "all") return true;
      return p.roles.includes(filterRole);
    });

    if (filtered.length === 0) {
      gridEl.innerHTML = `
        <p style="font-size:13px; opacity:0.8;">
          아직 이 포지션에 등록된 스태프가 없습니다.
        </p>`;
      return;
    }

    for (const p of filtered) {
      const tagsHtml = (p.style_tags || [])
        .map(t => `<span class="tag">${t}</span>`).join("");

      const cardHtml = `
        <article class="card">
          <div class="name-line">
            <div class="name">${p.name}</div>
            <div class="level-pill">${p.level}</div>
          </div>
          <div class="roles">${p.roles.join(" · ")}</div>
          <div class="gear">주 업무 · ${p.main_gear}</div>
          <div class="tags">${tagsHtml}</div>
        </article>`;
      gridEl.insertAdjacentHTML("beforeend", cardHtml);
    }
  }

  tabEls.forEach(tab => {
    tab.addEventListener("click", () => {
      tabEls.forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      renderStaff(tab.dataset.role);
    });
  });

  renderStaff("all");
</script>

</body>
</html>

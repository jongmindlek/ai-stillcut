<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>FIDUCIA DIRECTORS · 감독 라인업</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #07080b;
      color: #f5f5f5;
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }

    .wrapper {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 64px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      margin-bottom: 24px;
    }
    .logo {
      font-size: 14px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 700;
    }
    .tagline {
      font-size: 12px;
      opacity: 0.8;
    }

    nav {
      font-size: 12px;
      display: flex;
      gap: 10px;
      opacity: 0.8;
    }
    nav a {
      color: rgba(255,255,255,0.8);
    }

    h1 {
      font-size: 26px;
      margin: 20px 0 8px;
    }
    .lead {
      font-size: 14px;
      color: rgba(255,255,255,0.8);
      margin-bottom: 16px;
    }

    /* 검색 바 */
    .search-row {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 9px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(7,8,11,0.95);
      color: #f5f5f5;
      font-size: 13px;
      outline: none;
    }
    .search-input:focus {
      border-color: #3A6CF3;
      box-shadow: 0 0 0 1px rgba(58,108,243,0.5);
    }
    .search-hint {
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      margin-top: 4px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .card {
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.18), transparent 55%),
        radial-gradient(circle at bottom right, rgba(255,255,255,0.06), transparent 55%);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.16);
      padding: 16px 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: transform 0.08s ease-out, box-shadow 0.08s ease-out, border-color 0.08s ease-out;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(0,0,0,0.45);
      border-color: rgba(122,165,255,0.7);
    }

    .name-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .name {
      font-size: 16px;
      font-weight: 600;
    }
    .level-pill {
      font-size: 11px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.25);
      padding: 2px 8px;
      opacity: 0.85;
    }
    .roles {
      font-size: 12px;
      opacity: 0.85;
    }
    .meta {
      font-size: 12px;
      opacity: 0.8;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }
    .tag {
      font-size: 11px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.25);
      padding: 2px 8px;
      opacity: 0.9;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
      font-size: 12px;
    }
    .link-pill {
      border-radius: 999px;
      border: 1px solid rgba(123,165,255,0.8);
      padding: 2px 10px;
      color: #7BA5FF;
    }
    .status {
      font-size: 12px;
      opacity: 0.8;
      margin-bottom: 10px;
    }
    .back-link {
      display: inline-block;
      margin-top: 28px;
      font-size: 13px;
      opacity: 0.85;
      color: #7BA5FF;
    }
  </style>
</head>

<body>
<div class="wrapper">
  <header>
    <div>
      <div class="logo">FIDUCIA · DIRECTORS</div>
      <nav>
        <a href="/">AI 스틸컷</a> ·
        <strong>DIRECTORS</strong> ·
        <a href="/staff.html">STAFF</a>
      </nav>
    </div>
    <div class="tagline">연출 · 촬영 · 조명 감독 라인업</div>
  </header>

  <main>
    <h1>FIDUCIA DIRECTORS</h1>
    <p class="lead">
      연출 / 촬영 / 조명 / 편집 등 각 파트의 감독·리더 포지션입니다.<br>
      프로젝트 톤과 예산, 장비 스타일에 맞는 감독을 찾을 때 참고용으로 사용하세요.
    </p>

    <!-- 🔍 검색 영역 -->
    <section class="search-row">
      <input
        id="searchInput"
        class="search-input"
        type="text"
        placeholder="이름, 파트(연출/촬영), 장비(FX3 등), 태그(브랜딩/웨딩 등)로 검색해보세요."
      />
      <div class="search-hint">
        예) “웨딩”, “브랜딩”, “FX3”, “연출 촬영”
      </div>
    </section>

    <div id="status" class="status">노션에서 데이터를 불러오는 중입니다...</div>
    <div id="directors-grid" class="grid"></div>

    <a href="/" class="back-link">← AI 스틸컷 서비스로 돌아가기</a>
  </main>
</div>

<script>
  const gridEl = document.getElementById("directors-grid");
  const statusEl = document.getElementById("status");
  const searchInputEl = document.getElementById("searchInput");

  let allDirectors = [];
  let currentKeyword = "";

  function renderDirectors() {
    gridEl.innerHTML = "";

    if (!allDirectors.length) {
      gridEl.innerHTML = `
        <p style="font-size:13px; opacity:0.8;">
          아직 등록된 감독 정보가 없습니다.
        </p>`;
      return;
    }

    const keyword = (currentKeyword || "").trim().toLowerCase();

    let list = allDirectors;
    if (keyword) {
      list = allDirectors.filter((p) => {
        const name = (p.name || "").toLowerCase();
        const roles = (p.roles || []).join(" ").toLowerCase();
        const tags = (p.tags || []).join(" ").toLowerCase();
        const gear = (p.main_gear || "").toLowerCase();
        const bio = (p.bio || "").toLowerCase();

        const haystack = [name, roles, tags, gear, bio].join(" ");
        return haystack.includes(keyword);
      });
    }

    if (!list.length) {
      gridEl.innerHTML = `
        <p style="font-size:13px; opacity:0.8;">
          검색 조건에 맞는 감독이 없습니다. 검색어를 줄여보거나 다른 키워드로 시도해 주세요.
        </p>`;
      return;
    }

    for (const p of list) {
      const rolesText = (p.roles || []).join(" · ");
      const tagsHtml = (p.tags || [])
        .map((t) => `<span class="tag">${t}</span>`)
        .join("");

      const links = [];
      if (p.portfolio_url) {
        links.push(
          `<a class="link-pill" href="${p.portfolio_url}" target="_blank" rel="noreferrer">포트폴리오</a>`
        );
      }
      if (p.schedule_url) {
        links.push(
          `<a class="link-pill" href="${p.schedule_url}" target="_blank" rel="noreferrer">스케줄</a>`
        );
      }
      if (p.instagram) {
        links.push(
          `<a class="link-pill" href="${p.instagram}" target="_blank" rel="noreferrer">Instagram</a>`
        );
      }

      const cardHtml = `
        <article class="card" data-id="${p.id}">
          <div class="name-line">
            <div class="name">${p.name || "이름 미입력"}</div>
            <div class="level-pill">${p.level || ""}</div>
          </div>
          ${rolesText ? `<div class="roles">파트 · ${rolesText}</div>` : ""}
          ${p.main_gear ? `<div class="meta">주 장비 · ${p.main_gear}</div>` : ""}
          <div class="tags">${tagsHtml}</div>
          <div class="links">${links.join("")}</div>
        </article>
      `;
      gridEl.insertAdjacentHTML("beforeend", cardHtml);
    }
  }

  async function loadDirectors() {
    try {
      statusEl.textContent = "노션에서 데이터를 불러오는 중입니다...";
      const res = await fetch("/.netlify/functions/directors");
      if (!res.ok) {
        const txt = await res.text();
        console.error("directors 함수 응답 오류:", txt);
        statusEl.textContent = "디렉터 정보를 불러오는 중 오류가 발생했습니다.";
        return;
      }
      const json = await res.json();
      allDirectors = json.items || [];
      statusEl.textContent = "";
      renderDirectors();
    } catch (e) {
      console.error("loadDirectors 오류:", e);
      statusEl.textContent = "디렉터 정보를 불러오는 중 오류가 발생했습니다.";
    }
  }

  // 🔍 검색 입력 이벤트
  searchInputEl.addEventListener("input", (e) => {
    currentKeyword = e.target.value;
    renderDirectors();
  });

  // 👆 카드 클릭 시 상세 페이지로 이동
  gridEl.addEventListener("click", (e) => {
    const card = e.target.closest(".card");
    if (!card) return;
    const id = card.dataset.id;
    if (!id) return;
    // id를 쿼리스트링으로 넘긴다
    window.location.href = `/director-detail.html?id=${encodeURIComponent(id)}`;
  });

  loadDirectors();
</script>

</body>
</html>

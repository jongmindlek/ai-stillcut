<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>FIDUCIA DIRECTORS · 감독 라인업</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #07080b;
      color: #f5f5f5;
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }

    .wrapper {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 64px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      margin-bottom: 24px;
    }
    .logo {
      font-size: 14px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 700;
    }
    .tagline {
      font-size: 12px;
      opacity: 0.8;
    }

    nav {
      font-size: 12px;
      display: flex;
      gap: 10px;
      opacity: 0.8;
    }
    nav a {
      color: rgba(255,255,255,0.8);
    }
    nav strong {
      font-weight: 700;
    }

    h1 {
      font-size: 26px;
      margin: 20px 0 8px;
    }
    .lead {
      font-size: 14px;
      color: rgba(255,255,255,0.8);
      margin-bottom: 12px;
    }

    /* 검색창 */
    .search-row {
      margin-bottom: 10px;
    }
    .search-input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(7,8,11,0.95);
      color: #f5f5f5;
      font-size: 13px;
      outline: none;
    }
    .search-input::placeholder {
      color: rgba(255,255,255,0.45);
    }
    .search-input:focus {
      border-color: #3A6CF3;
      box-shadow: 0 0 0 1px rgba(58,108,243,0.4);
    }

    /* 필터 영역 */
    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
      font-size: 13px;
    }
    .filter-chip {
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.22);
      padding: 4px 10px;
      background: transparent;
      color: #f5f5f5;
      cursor: pointer;
      opacity: 0.82;
    }
    .filter-chip.active {
      background: linear-gradient(135deg, #3A6CF3, #7BA5FF);
      color: #05060a;
      border-color: transparent;
      opacity: 1;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .card {
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.18), transparent 55%),
        radial-gradient(circle at bottom right, rgba(255,255,255,0.06), transparent 55%);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.16);
      padding: 16px 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
    }

    .name-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .name {
      font-size: 16px;
      font-weight: 600;
    }
    .level-pill {
      font-size: 11px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.25);
      padding: 2px 8px;
      opacity: 0.85;
    }

    /* 즐겨찾기 버튼 */
    .fav-btn {
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 17px;
      line-height: 1;
      padding: 0 0 0 8px;
      color: rgba(255,255,255,0.5);
    }
    .fav-btn.active {
      color: #ffd86b;
      text-shadow: 0 0 6px rgba(255,216,107,0.6);
    }

    .roles {
      font-size: 12px;
      opacity: 0.85;
    }
    .meta {
      font-size: 12px;
      opacity: 0.8;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }
    .tag {
      font-size: 11px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.25);
      padding: 2px 8px;
      opacity: 0.9;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
      font-size: 12px;
    }
    .link-pill {
      border-radius: 999px;
      border: 1px solid rgba(123,165,255,0.8);
      padding: 2px 10px;
      color: #7BA5FF;
    }

    .detail-link {
      margin-top: 4px;
      font-size: 12px;
      opacity: 0.85;
      color: rgba(255,255,255,0.85);
      text-decoration: underline;
      text-decoration-style: dotted;
    }

    .status {
      font-size: 12px;
      opacity: 0.8;
      margin-bottom: 10px;
    }
    .back-link {
      display: inline-block;
      margin-top: 28px;
      font-size: 13px;
      opacity: 0.85;
      color: #7BA5FF;
    }
  </style>
</head>

<body>
<div class="wrapper">
  <header>
    <div>
      <div class="logo">FIDUCIA · DIRECTORS</div>
      <nav>
        <a href="/">AI 스틸컷</a> ·
        <strong>DIRECTORS</strong> ·
        <a href="/staff.html">STAFF</a>
      </nav>
    </div>
    <div class="tagline">연출 · 촬영 · 조명 감독 라인업</div>
  </header>

  <main>
    <h1>FIDUCIA DIRECTORS</h1>
    <p class="lead">
      연출 / 촬영 / 조명 / 편집 등 각 파트의 감독·리더 포지션입니다.<br>
      프로젝트 톤과 예산, 장비 스타일에 맞는 감독을 찾을 때 참고용으로 사용하세요.
    </p>

    <!-- 검색 -->
    <div class="search-row">
      <input
        id="search-input"
        class="search-input"
        type="text"
        placeholder="이름, 파트, 주 장비, 태그로 검색해보세요."
      />
    </div>

    <!-- 필터 -->
    <div class="filter-row">
      <button class="filter-chip active" data-filter="all">전체</button>
      <button class="filter-chip" data-filter="fav">즐겨찾기만</button>
    </div>

    <div id="status" class="status">노션에서 데이터를 불러오는 중입니다...</div>
    <div id="directors-grid" class="grid"></div>

    <a href="/" class="back-link">← AI 스틸컷 서비스로 돌아가기</a>
  </main>
</div>

<script>
  const gridEl = document.getElementById("directors-grid");
  const statusEl = document.getElementById("status");
  const searchInput = document.getElementById("search-input");

  const FILTER_ALL = "all";
  const FILTER_FAV = "fav";
  let currentFilter = FILTER_ALL;

  let allDirectors = [];
  let favoriteIds = [];
  let searchTerm = "";

  const FAV_KEY = "fiducia_fav_directors_v1";

  function loadFavorites() {
    try {
      const raw = localStorage.getItem(FAV_KEY);
      if (!raw) {
        favoriteIds = [];
        return;
      }
      const arr = JSON.parse(raw);
      favoriteIds = Array.isArray(arr) ? arr : [];
    } catch (e) {
      console.warn("즐겨찾기 로드 오류:", e);
      favoriteIds = [];
    }
  }

  function saveFavorites() {
    try {
      localStorage.setItem(FAV_KEY, JSON.stringify(favoriteIds));
    } catch (e) {
      console.warn("즐겨찾기 저장 오류:", e);
    }
  }

  function isFavorite(id) {
    return favoriteIds.includes(id);
  }

  function toggleFavorite(id) {
    if (!id) return;
    if (isFavorite(id)) {
      favoriteIds = favoriteIds.filter(x => x !== id);
    } else {
      favoriteIds.push(id);
    }
    saveFavorites();
    renderDirectors();
  }

  function setFilter(filter) {
    currentFilter = filter;
    const chips = document.querySelectorAll(".filter-chip");
    chips.forEach(chip => {
      const f = chip.getAttribute("data-filter");
      chip.classList.toggle("active", f === filter);
    });
    renderDirectors();
  }

  function setSearch(term) {
    searchTerm = (term || "").toLowerCase();
    renderDirectors();
  }

  function renderDirectors() {
    gridEl.innerHTML = "";

    let list = allDirectors.slice();

    // 즐겨찾기 필터
    if (currentFilter === FILTER_FAV) {
      list = list.filter(p => isFavorite(p.id));
    }

    // 검색 필터
    if (searchTerm) {
      list = list.filter(p => {
        const fields = [
          p.name || "",
          (p.roles || []).join(" "),
          p.main_gear || "",
          (p.tags || []).join(" ")
        ].join(" ").toLowerCase();
        return fields.includes(searchTerm);
      });
    }

    if (!list.length) {
      const msg =
        currentFilter === FILTER_FAV
          ? "조건에 맞는 즐겨찾기 감독이 없습니다."
          : "조건에 맞는 감독이 없습니다.";
      gridEl.innerHTML = `<p style="font-size:13px; opacity:0.8;">${msg}</p>`;
      return;
    }

    for (const p of list) {
      const rolesText = (p.roles || []).join(" · ");
      const tagsHtml = (p.tags || [])
        .map(t => `<span class="tag">${t}</span>`).join("");

      const links = [];
      if (p.portfolio_url) {
        links.push(`<a class="link-pill" href="${p.portfolio_url}" target="_blank" rel="noreferrer">포트폴리오</a>`);
      }
      if (p.schedule_url) {
        links.push(`<a class="link-pill" href="${p.schedule_url}" target="_blank" rel="noreferrer">스케줄</a>`);
      }
      if (p.instagram) {
        links.push(`<a class="link-pill" href="${p.instagram}" target="_blank" rel="noreferrer">Instagram</a>`);
      }

      const detailUrl = "/director-detail.html?id=" + encodeURIComponent(p.id);
      const favActiveClass = isFavorite(p.id) ? "active" : "";
      const favSymbol = isFavorite(p.id) ? "★" : "☆";

      const cardHtml = `
        <article class="card">
          <div class="name-line">
            <div>
              <div class="name">${p.name || "이름 미입력"}</div>
              ${p.level ? `<div class="level-pill">${p.level}</div>` : ""}
            </div>
            <button class="fav-btn ${favActiveClass}" data-id="${p.id}" aria-label="즐겨찾기">
              ${favSymbol}
            </button>
          </div>

          ${rolesText ? `<div class="roles">파트 · ${rolesText}</div>` : ""}
          ${p.main_gear ? `<div class="meta">주 장비 · ${p.main_gear}</div>` : ""}
          <div class="tags">${tagsHtml}</div>
          <div class="links">${links.join("")}</div>
          <a class="detail-link" href="${detailUrl}">감독 상세 보기 →</a>
        </article>
      `;
      gridEl.insertAdjacentHTML("beforeend", cardHtml);
    }

    attachFavoriteHandlers();
  }

  function attachFavoriteHandlers() {
    const buttons = document.querySelectorAll(".fav-btn");
    buttons.forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const id = btn.getAttribute("data-id");
        toggleFavorite(id);
      };
    });
  }

  async function loadDirectors() {
    try {
      statusEl.textContent = "노션에서 데이터를 불러오는 중입니다...";
      const res = await fetch("/.netlify/functions/directors");
      if (!res.ok) {
        const txt = await res.text();
        console.error("directors 함수 응답 오류:", txt);
        statusEl.textContent = "디렉터 정보를 불러오는 중 오류가 발생했습니다.";
        return;
      }
      const json = await res.json();
      allDirectors = json.items || [];
      statusEl.textContent = "";
      renderDirectors();
    } catch (e) {
      console.error("loadDirectors 오류:", e);
      statusEl.textContent = "디렉터 정보를 불러오는 중 오류가 발생했습니다.";
    }
  }

  // 초기화
  loadFavorites();
  loadDirectors();

  // 필터 버튼 이벤트
  document.querySelectorAll(".filter-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      const f = chip.getAttribute("data-filter");
      setFilter(f);
    });
  });

  // 검색 이벤트
  searchInput.addEventListener("input", (e) => {
    setSearch(e.target.value);
  });
</script>

</body>
</html>

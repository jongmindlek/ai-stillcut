<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>FIDUCIA · AI 스틸컷 예약</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #07080b;
      color: #f5f5f5;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      max-width: 500px;
      width: 100%;
    }
    .form-container input, .form-container select, .form-container textarea {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 4px;
      border: 1px solid #ccc;
      background-color: #333;
      color: #fff;
    }
    .form-container button {
      background-color: #0078d4;
      color: white;
      padding: 12px;
      border: none;
      cursor: pointer;
      width: 100%;
    }
    .form-container button:hover {
      background-color: #005b99;
    }
  </style>
</head>
<body>
  <!-- 예약 모달 창 -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <h2>예약 신청</h2>
      <form id="reservation-form">
        <!-- 스틸컷 미리보기 정보 삽입 -->
        <p>예약하신 스틸컷: <strong id="preview-info">스틸컷 정보가 여기에 표시됩니다.</strong></p>
        <img id="preview-image" src="" alt="스틸컷 이미지" style="width: 100%;"/>

        <label for="name">이름:</label>
        <input type="text" id="name" name="name" required />

        <label for="contact">연락처 (전화번호):</label>
        <input type="text" id="contact" name="contact" required />

        <label for="notes">메모:</label>
        <textarea id="notes" name="notes"></textarea>

        <button type="submit">예약 신청하기</button>
      </form>
      <p id="status"></p>
      <button type="button" onclick="closeModal()">닫기</button>
    </div>
  </div>

  <!-- 미리보기 이미지 및 예약 버튼 -->
  <div id="preview">
    <img id="preview-image" src="preview-image.jpg" alt="스틸컷 미리보기" />
    <button id="open-reservation-form">예약하기</button>
  </div>

  <script>
    // 미리보기 정보 및 예약 폼 처리
    document.getElementById("open-reservation-form").addEventListener("click", function() {
      const previewInfo = document.getElementById("preview-info");
      previewInfo.textContent = "스틸컷 정보: 예시 스틸컷";  // 실제 스틸컷 정보로 교체
      document.getElementById("preview-image").src = "preview-image.jpg"; // 실제 이미지 URL로 교체
      modal.style.display = "flex";
    });

    // 모달 닫기
    function closeModal() {
      modal.style.display = "none";
    }

    // 예약 폼 제출 시 처리
    document.getElementById("reservation-form").addEventListener("submit", async function(event) {
      event.preventDefault();

      const form = new FormData(this);
      const data = {
        name: form.get("name"),
        contact: form.get("contact"),
        notes: form.get("notes"),
        previewInfo: document.getElementById("preview-info").textContent,
        previewImage: document.getElementById("preview-image").src
      };

      // 실제 예약 API 호출 (Netlify 함수와 연결)
      const response = await fetch("/.netlify/functions/reserve", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
      });

      const result = await response.json();
      alert(result.message);  // 예약 처리 완료 메시지 출력
    });
  </script>
</body>
</html>

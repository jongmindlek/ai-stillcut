<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>FIDUCIA DIRECTORS · 크리에이터 라인업</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #07080b;
      color: #f5f5f5;
      line-height: 1.6;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    .wrapper {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 64px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      margin-bottom: 24px;
    }
    .logo {
      font-size: 14px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 700;
    }
    .tagline {
      font-size: 12px;
      opacity: 0.8;
    }

    h1 {
      font-size: 26px;
      margin: 20px 0 8px;
    }
    .lead {
      font-size: 14px;
      color: rgba(255,255,255,0.8);
      margin-bottom: 20px;
    }

    /* 탭 (파트 선택) */
    .role-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }
    .role-tab {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.2);
      font-size: 12px;
      cursor: pointer;
      background: transparent;
      color: #f5f5f5;
      opacity: 0.75;
    }
    .role-tab.active {
      background: linear-gradient(135deg, #3A6CF3, #7BA5FF);
      color: #07080b;
      opacity: 1;
      border-color: transparent;
    }

    /* 카드 그리드 */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }
    .card {
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.18), transparent 55%),
        radial-gradient(circle at bottom right, rgba(255,255,255,0.06), transparent 55%);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.16);
      padding: 16px 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .name-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .name {
      font-size: 16px;
      font-weight: 600;
    }
    .level-pill {
      font-size: 11px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.25);
      padding: 2px 8px;
      opacity: 0.85;
    }
    .roles {
      font-size: 12px;
      opacity: 0.85;
    }
    .gear {
      font-size: 12px;
      opacity: 0.85;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }
    .tag {
      font-size: 11px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.25);
      padding: 2px 8px;
      opacity: 0.9;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
      font-size: 12px;
    }
    .link-btn {
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.3);
      font-size: 12px;
      opacity: 0.9;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .link-btn span {
      font-size: 13px;
    }

    .back-link {
      display: inline-block;
      margin-top: 28px;
      font-size: 13px;
      opacity: 0.85;
      color: #7BA5FF;
    }

    @media (max-width: 640px) {
      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header>
      <div class="logo">FIDUCIA · DIRECTORS</div>
      <div class="tagline">연출 · 촬영 · 조명 · 후반 디렉터 라인업</div>
    </header>

    <main>
      <h1>FIDUCIA DIRECTORS</h1>
      <p class="lead">
        AI 스틸컷 이후, 실제 프로젝트를 함께 만들 디렉터들을 한 곳에서 조회할 수 있는 공간입니다.<br>
        파트별로 필터링해서 연출 / 촬영 / 조명 / 편집 / 미술 / 음향 담당을 찾아보세요.
      </p>

      <!-- 파트 탭 -->
      <div class="role-tabs">
        <button class="role-tab active" data-role="all">전체</button>
        <button class="role-tab" data-role="연출">연출</button>
        <button class="role-tab" data-role="촬영">촬영</button>
        <button class="role-tab" data-role="조명">조명</button>
        <button class="role-tab" data-role="편집">편집</button>
        <button class="role-tab" data-role="미술">미술</button>
        <button class="role-tab" data-role="음향">음향</button>
      </div>

      <!-- 카드들 -->
      <div id="directors-grid" class="grid"></div>

      <a href="/" class="back-link">← AI 스틸컷 서비스로 돌아가기</a>
    </main>
  </div>

  <script>
    // 앞으로 Notion DB랑 연결할 "정답 구조"라고 생각하면 됨
    const people = [
      {
        name: "정훈 감독",
        type: "director",
        roles: ["연출", "촬영"],
        main_gear: "Sony FX3 · 24-70GM · 짐벌 세트",
        style_tags: ["브랜딩 강점", "빠른 촬영", "소규모 크루 최적화"],
        level: "Lead Director",
        portfolio_url: "https://notion.so/your-portfolio-here",
        schedule_url: "https://notion.so/your-schedule-here",
        instagram: "https://instagram.com/your_instagram"
      },
      {
        name: "홍길동 DOP",
        type: "director",
        roles: ["촬영", "조명"],
        main_gear: "FX6 · 시네 줌 · Aputure 600D",
        style_tags: ["로우라이트", "시네마틱 무드", "롱테이크"],
        level: "Director of Photography",
        portfolio_url: "",
        schedule_url: "",
        instagram: ""
      },
      {
        name: "김편집",
        type: "director",
        roles: ["편집"],
        main_gear: "DaVinci Resolve · Premiere Pro",
        style_tags: ["리듬 편집", "뮤직비디오", "컬러 감각"],
        level: "Editor",
        portfolio_url: "",
        schedule_url: "",
        instagram: ""
      }
      // 🔻 나중에 여기 아래로 계속 추가하면 됨
    ];

    const gridEl = document.getElementById("directors-grid");
    const tabEls = document.querySelectorAll(".role-tab");

    function renderDirectors(filterRole = "all") {
      gridEl.innerHTML = "";

      const filtered = people.filter(p => {
        if (p.type !== "director") return false; // 디렉터만
        if (filterRole === "all") return true;
        return p.roles && p.roles.includes(filterRole);
      });

      if (filtered.length === 0) {
        gridEl.innerHTML = `
          <p style="font-size:13px; opacity:0.8;">
            아직 이 파트에 등록된 디렉터가 없습니다. 추후 FIDUCIA COLLECTIVE 라인업이 추가될 예정입니다.
          </p>
        `;
        return;
      }

      for (const p of filtered) {
        const rolesText = (p.roles || []).join(" · ");
        const tagsHtml = (p.style_tags || [])
          .map(tag => `<span class="tag">${tag}</span>`)
          .join("");

        const links = [];

        if (p.portfolio_url) {
          links.push(
            `<a class="link-btn" href="${p.portfolio_url}" target="_blank" rel="noopener">
              <span>📂</span> 포트폴리오
            </a>`
          );
        }
        if (p.schedule_url) {
          links.push(
            `<a class="link-btn" href="${p.schedule_url}" target="_blank" rel="noopener">
              <span>📅</span> 스케줄
            </a>`
          );
        }
        if (p.instagram) {
          links.push(
            `<a class="link-btn" href="${p.instagram}" target="_blank" rel="noopener">
              <span>🟣</span> 인스타그램
            </a>`
          );
        }

        const linksHtml = links.length
          ? `<div class="links">${links.join("")}</div>`
          : "";

        const cardHtml = `
          <article class="card">
            <div class="name-line">
              <div class="name">${p.name}</div>
              <div class="level-pill">${p.level || "Director"}</div>
            </div>
            <div class="roles">${rolesText || "파트 미지정"}</div>
            <div class="gear">주 장비 · ${p.main_gear || "장비 정보 미입력"}</div>
            <div class="tags">${tagsHtml}</div>
            ${linksHtml}
          </article>
        `;
        gridEl.insertAdjacentHTML("beforeend", cardHtml);
      }
    }

    // 탭 클릭 이벤트
    tabEls.forEach(tab => {
      tab.addEventListener("click", () => {
        tabEls.forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        const role = tab.getAttribute("data-role");
        renderDirectors(role);
      });
    });

    // 초기 렌더
    renderDirectors("all");
  </script>
</body>
</html>
